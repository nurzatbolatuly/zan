# Локальный стек всего бэкенда — BACKEND_PLAN.md, Stage 0.
# `docker compose up` поднимает postgres (pgvector) + minio + backend (Go) +
# helper (Python). Переменные — см. .env.example в корне.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zan}
      POSTGRES_DB: ${POSTGRES_DB:-zan}
      # RAG_DB_PASSWORD — пароль отдельной роли zan_rag, заводится
      # scripts/postgres-init/01-rag-role.sh на пустом томе (Stage 5,
      # BACKEND_PLAN.md §1.3: schema rag изолирована от core своей ролью).
      RAG_DB_PASSWORD: ${RAG_DB_PASSWORD:-devragdbpasswordchangeme}
      # CORE_DB_PASSWORD — пароль отдельной роли zan_core, заводится
      # scripts/postgres-init/02-core-role.sh на пустом томе (Stage 8 —
      # backend/DATABASE_URL больше не ходит под бутстрап-суперпользователем
      # POSTGRES_USER, полная симметрия изоляции core/rag из BACKEND_PLAN.md
      # §1.3, см. комментарий в самом 02-core-role.sh).
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:-devcoredbpasswordchangeme}
    ports:
      - "5432:5432"
    volumes:
      - zan-postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-zan} -d $${POSTGRES_DB:-zan}"]
      interval: 5s
      timeout: 3s
      retries: 10

  clamav:
    # Stage 8 (BACKEND_PLAN.md §6 "Security-обход") — заменяет
    # file.NoopAVScanner (internal/platform/clamav.Scanner, clamd INSTREAM
    # по TCP 3310). Официальный образ публикуется только под linux/amd64
    # (проверено при реализации Stage 8 — `docker manifest inspect
    # clamav/clamav:stable` не отдаёт arm64/v8) — на Apple Silicon поднимается
    # через эмуляцию (Docker Desktop это умеет "из коробки", ощутимо
    # медленнее нативного, но работает), platform ниже нужен именно поэтому.
    # CLAMAV_NO_FRESHCLAMD=true — не тянуть свежие сигнатуры при каждом
    # старте (сеть/время): используем базу, вшитую в образ на момент сборки
    # тега "stable" — сознательный компромисс для dev/CI-стенда, не для
    # прода (см. BACKEND_LOG.md, Stage 8 — в проде обновлять образ регулярно
    # или гонять freshclam отдельным cron/сайдкаром).
    # Healthcheck не переопределяем — образ уже несёт свой собственный
    # HEALTHCHECK (clamdcheck.sh, StartPeriod 360s — загрузка вшитой базы в
    # память клиента при старте не мгновенна, проверено вручную при
    # реализации Stage 8), тот же приём, что и у backend/helper ниже.
    image: clamav/clamav:stable
    platform: linux/amd64
    environment:
      CLAMAV_NO_FRESHCLAMD: "true"

  minio:
    # Docker Hub образ minio/minio больше не публикуется (проверено при
    # реализации Stage 0 — pull access denied) — актуальный источник quay.io.
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-zanminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-zanminiosecret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - zan-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      ENV: ${ENV:-dev}
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      GRPC_HELPER_TARGET: "helper:9090"
      # DATABASE_URL — роль zan_core (Stage 8), НЕ POSTGRES_USER/PASSWORD
      # бутстрап-суперпользователя, которым backend/ пользовался раньше —
      # заводится scripts/postgres-init/02-core-role.sh, тот же приём, что
      # RAG_DATABASE_URL/zan_rag у helper/ ниже (полная симметрия изоляции
      # core/rag, BACKEND_PLAN.md §1.3).
      DATABASE_URL: "postgres://zan_core:${CORE_DB_PASSWORD:-devcoredbpasswordchangeme}@postgres:5432/${POSTGRES_DB:-zan}?sslmode=disable"
      # ADMIN_TOKEN/SESSION_HMAC_SECRET — обязательные секреты Stage 1
      # (BACKEND_PLAN.md §6 п.1, internal/config), без дефолта в самом Go-коде
      # намеренно; значения ниже — только для локальной разработки, не для
      # прода (см. .env.example).
      ADMIN_TOKEN: ${ADMIN_TOKEN:-devadmintokendevadmintokendevadmintoken1}
      SESSION_HMAC_SECRET: ${SESSION_HMAC_SECRET:-devhmacsecretchangemedevhmacsecretchangeme1}
      # INTERNAL_SECRET — общий с helper/ секрет gRPC-метадаты x-internal-secret
      # (Stage 4, BACKEND_PLAN.md §1: "shared secret — вторая линия обороны").
      INTERNAL_SECRET: ${INTERNAL_SECRET:-devinternalsecretchangemedevinternalsecretchangeme1}
      # S3_ENDPOINT — внутри docker-сети (DNS-имя сервиса minio), для реальных
      # S3-операций и presign-ссылок, которые должен разыменовать helper/.
      # S3_PUBLIC_ENDPOINT — снаружи сети (браузер/curl с хоста), см.
      # internal/platform/storage.Config — presigned-ссылка не может
      # использовать внутреннее DNS-имя вне docker-сети (Stage 4, BACKEND_LOG.md).
      S3_ENDPOINT: "http://minio:9000"
      S3_PUBLIC_ENDPOINT: "http://localhost:9000"
      S3_REGION: "us-east-1"
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-zanminio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-zanminiosecret}
      S3_BUCKET: "zan-files"
      # --- LLM-провайдер (Stage 5, BACKEND_PLAN.md §3: "Anthropic API") ---
      # ANTHROPIC_API_KEY — без дефолта в Go-коде (internal/config), значение
      # ниже — placeholder для локального docker-compose up без реального
      # ключа: RAG/остальной стек поднимается и работает, вызов LLM реально
      # упадёт на 401 (Anthropic отклонит ключ) — это ожидаемо и покрыто тем
      # же путём, что таймаут/5xx (status=error, кредит возвращается), см.
      # scripts/smoke-test.sh. Подставьте реальный ключ в .env для настоящих
      # ответов агента.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-sk-ant-dev-placeholder-not-a-real-key}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      # CLAMAV_ADDR — Stage 8, internal/platform/clamav.Scanner заменяет
      # file.NoopAVScanner (см. сервис clamav выше).
      CLAMAV_ADDR: "clamav:3310"
      # CORS_ALLOWED_ORIGINS — Stage 8, пусто в dev (см. .env.example) —
      # заполнить origin'ом задеплоенного фронта в проде.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
    # HEALTHCHECK уже задан в backend/Dockerfile (distroless — своя логика
    # в бинаре, см. cmd/api/healthcheck.go), здесь ничего не переопределяем.

  helper:
    build:
      context: ./helper
    environment:
      ENV: ${ENV:-dev}
      GRPC_PORT: "9090"
      HEALTH_HTTP_PORT: "8001"
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      # INTERNAL_SECRET/S3_* — см. комментарий у сервиса backend выше, те же
      # значения (общий секрет и общий бакет между двумя сервисами).
      INTERNAL_SECRET: ${INTERNAL_SECRET:-devinternalsecretchangeme}
      S3_ENDPOINT: "http://minio:9000"
      S3_PUBLIC_ENDPOINT: "http://localhost:9000"
      S3_REGION: "us-east-1"
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-zanminio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-zanminiosecret}
      S3_BUCKET: "zan-files"
      # WHISPER_MODEL_SIZE — self-hosted faster-whisper (BACKEND_PLAN.md §6
      # п.10), "tiny" в dev/CI — минимальная модель, быстрая загрузка/инференс,
      # точность распознавания вторична для smoke/dev-стенда.
      WHISPER_MODEL_SIZE: "tiny"
      # RAG_DATABASE_URL — роль zan_rag (не тот же DSN, что DATABASE_URL у
      # backend/ — Stage 5, BACKEND_PLAN.md §1.3), заводится
      # scripts/postgres-init/01-rag-role.sh. Миграции (helper/migrations,
      # Alembic) используют этот же DSN — роль владеет схемой rag с
      # момента бутстрапа, права на CREATE TABLE в своей схеме ей не нужно
      # занимать отдельно.
      RAG_DATABASE_URL: "postgres://zan_rag:${RAG_DB_PASSWORD:-devragdbpasswordchangeme}@postgres:5432/${POSTGRES_DB:-zan}"
    ports:
      - "9090:9090"
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      # Stage 4: helper/ теперь тоже говорит с MinIO напрямую (скачивание
      # file_url, загрузка сгенерированных документов, ensure_bucket на
      # старте — app/adapters/storage.py) — раньше не было нужно.
      minio:
        condition: service_healthy
    # HEALTHCHECK уже задан в helper/Dockerfile (healthcheck.py).

volumes:
  zan-postgres-data:
  zan-minio-data:
