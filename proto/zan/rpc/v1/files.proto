syntax = "proto3";

package zan.rpc.v1;

option go_package = "zan-backend/internal/genproto/zan/rpc/v1;zanv1";

// FilesService — операции над уже сохранёнными в S3-совместимом хранилище
// файлами, оба RPC синхронные. Extract — извлечение текста вложения
// (BACKEND_PLAN.md §3, Stage 4; backend/internal/service/file сразу после
// сохранения файла). ConvertToPdf — PDF-копия DOCX-шаблона документа для
// просмотра в админке (backend/internal/service/template).
service FilesService {
  rpc Extract(ExtractRequest) returns (ExtractResponse);
  rpc ConvertToPdf(ConvertToPdfRequest) returns (ConvertToPdfResponse);
}

// ExtractRequest — file_url, не байты (BACKEND_PLAN.md §3.1: payload
// остаётся маленьким, лимит unary-сообщения gRPC не бьёт при любом размере
// файла). file_url — presigned GET-ссылка на собственный MinIO/S3
// backend'а, короткого времени жизни (internal/grpcclient генерирует её
// непосредственно перед вызовом) — Python обязан проверить, что host
// ссылки совпадает с его собственным сконфигурированным storage-эндпоинтом,
// прежде чем идти по ней (SSRF-риск, BACKEND_PLAN.md §8).
message ExtractRequest {
  string file_url = 1;
  string mime_type = 2;
}

message ExtractResponse {
  string text = 1;
}

// ConvertToPdfRequest — те же правила для file_url, что у ExtractRequest
// (presigned-ссылка на собственный storage, SSRF-проверка на стороне Python).
// mime_type — сейчас поддерживается только DOCX; остальное — INVALID_ARGUMENT.
message ConvertToPdfRequest {
  string file_url = 1;
  string mime_type = 2;
}

// ConvertToPdfResponse — ключ готового PDF в том же бакете (не ссылка и не
// байты, тот же принцип, что RenderResponse.object_key): владелец объекта
// дальше — backend/, он же перевыпускает ссылки и удаляет объект.
message ConvertToPdfResponse {
  string object_key = 1;
}
