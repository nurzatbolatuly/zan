name: backend-ci

on:
  pull_request:
    paths:
      - "backend/**"
      - "helper/**"
      - "proto/**"
      - "Makefile"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "helper/**"
      - "proto/**"

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - name: buf lint
        working-directory: proto
        run: buf lint
      # buf breaking сравнивает с main — на PR в main это no-op на самом main,
      # но ловит несовместимые изменения контракта на всех остальных PR
      # (BACKEND_PLAN.md §3.2, BACKEND_CODING_STANDARDS.md §7).
      - name: buf breaking (against main)
        if: github.event_name == 'pull_request'
        working-directory: proto
        run: buf breaking --against "https://github.com/${{ github.repository }}.git#branch=main"

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: go vet
        working-directory: backend
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          working-directory: backend
          version: latest
      - name: go test
        working-directory: backend
        run: go test ./...

  helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        working-directory: helper
        run: pip install -e ".[dev]"
      - name: ruff check
        working-directory: helper
        run: ruff check .
      - name: ruff format --check
        working-directory: helper
        run: ruff format --check .
      - name: mypy
        working-directory: helper
        run: mypy app tests
      - name: pytest
        working-directory: helper
        run: pytest

  # Реальный docker-compose стек: postgres+pgvector/minio/backend/helper,
  # то же самое, что `make smoke` локально (scripts/smoke-test.sh — единый
  # источник правды для обоих). Только после того, как юнит-тесты/линт уже
  # зелёные — нет смысла поднимать докер, если backend/helper и так не
  # проходят.
  smoke:
    runs-on: ubuntu-latest
    needs: [backend, helper]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: install grpcurl
        run: |
          go install github.com/fullstorydev/grpcurl/cmd/grpcurl@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # Stage 4 — smoke-test.sh применяет миграции перед проверкой реальных
      # эндпоинтов (файлы/голос/треды), golang-migrate CLI не входит в
      # образ backend (BACKEND_PLAN.md §1.1).
      - name: install golang-migrate
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: smoke test
        run: ./scripts/smoke-test.sh
