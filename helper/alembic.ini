; Alembic — миграции схемы rag (BACKEND_PLAN.md §1.3: "владеет и мигрирует
; только Python"), отдельный CLI-шаг от рантайма процесса — тот же принцип,
; что golang-migrate у backend/ (BACKEND_CODING_STANDARDS.md, не встроено
; в бинарь/образ). sqlalchemy.url НЕ задаётся здесь — читается из
; RAG_DATABASE_URL в helper/migrations/env.py (та же переменная, что
; app.core.config.Settings.rag_database_url — один DSN на миграции и рантайм,
; роль zan_rag уже владеет схемой rag к моменту первого запуска alembic,
; см. scripts/postgres-init/).
[alembic]
script_location = migrations

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
